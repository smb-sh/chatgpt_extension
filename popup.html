<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Session Synchronizer</title>
  <style>
    body {
      width: 350px;
      padding: 15px;
      font-family: Arial, sans-serif;
    }
    .container {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    input[type="text"] {
      width: 100%;
      padding: 8px;
      box-sizing: border-box;
    }
    .toggle-container {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .switch {
      position: relative;
      display: inline-block;
      width: 50px;
      height: 24px;
    }
    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }
    .slider {
      position: absolute;
      cursor: pointer;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: #ccc;
      -webkit-transition: .4s;
      transition: .4s;
      border-radius: 34px;
    }
    .slider:before {
      position: absolute;
      content: "";
      height: 16px;
      width: 16px;
      left: 4px;
      bottom: 4px;
      background-color: white;
      -webkit-transition: .4s;
      transition: .4s;
      border-radius: 50%;
    }
    input:checked + .slider {
      background-color: #2196F3;
    }
    input:focus + .slider {
      box-shadow: 0 0 1px #2196F3;
    }
    input:checked + .slider:before {
      -webkit-transform: translateX(26px);
      -ms-transform: translateX(26px);
      transform: translateX(26px);
    }
    .buttons {
      display: flex;
      justify-content: center;
      margin-top: 15px;
      gap: 10px;
    }
    button {
      padding: 8px 15px;
      background-color: #4285f4;
      color: white;
      border: none;
      border-radius: 3px;
      cursor: pointer;
    }
    button:hover {
      background-color: #3367d6;
    }
    .status {
      margin-top: 10px;
      font-size: 0.9em;
      color: #666;
    }
    .token-box {
      padding: 10px;
      background-color: #f8f9fa;
      border: 1px solid #ddd;
      border-radius: 3px;
      margin-top: 10px;
      word-break: break-all;
    }
    .tab-bar {
      display: flex;
      margin-bottom: 15px;
      border-bottom: 1px solid #ccc;
    }
    .tab {
      padding: 8px 15px;
      cursor: pointer;
      margin-right: 5px;
    }
    .tab.active {
      background-color: #4285f4;
      color: white;
      border-radius: 3px 3px 0 0;
    }
    .tab-content {
      display: none;
    }
    .tab-content.active {
      display: block;
    }
    .copy-button {
      padding: 5px 10px;
      font-size: 0.8em;
      margin-top: 5px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Session Synchronizer</h2>
    
    <div class="tab-bar">
      <div class="tab active" data-tab="creator">Token Creator</div>
      <div class="tab" data-tab="consumer">Token Consumer</div>
    </div>
    
    <!-- General Settings -->
    <div>
      <label for="serverUrl">Server URL:</label>
      <input type="text" id="serverUrl" placeholder="http://your-server-address:3000" />
      <div class="status" style="margin-top: 5px; font-size: 0.8em;">Enter your synchronization server URL</div>
    </div>
    
    <!-- Token Creator Section -->
    <div class="tab-content active" id="creator-tab">
      <div>
        <label for="domain">Website Domain:</label>
        <input type="text" id="domain" placeholder="chatgpt.com (default)" />
        <div class="status" style="margin-top: 5px; font-size: 0.8em;">Default domain is chatgpt.com</div>
      </div>
      
      <div class="toggle-container">
        <span>Enable Synchronization:</span>
        <label class="switch">
          <input type="checkbox" id="enableSync">
          <span class="slider"></span>
        </label>
      </div>
      
      <div class="buttons">
        <button id="saveSettings">Save Settings</button>
        <button id="createToken">Create Token</button>
      </div>
      
      <div id="tokenContainer" style="display: none;">
        <div class="status">Your Token:</div>
        <div class="token-box" id="tokenValue"></div>
        <button class="copy-button" id="copyToken">Copy Token</button>
      </div>
    </div>
    
    <!-- Token Consumer Section -->
    <div class="tab-content" id="consumer-tab">
      <div>
        <label for="token">Token:</label>
        <input type="text" id="token" placeholder="Enter the received token" />
      </div>
      
      <div class="buttons">
        <button id="useToken">Use Token</button>
      </div>
      
      <div id="tokenInfo" style="display: none;">
        <div class="status">Token Information:</div>
        <div class="token-box" id="tokenInfoValue"></div>
      </div>
    </div>
    
    <div class="status" id="status"></div>
    <div class="status" id="lastUpdated"></div>
  </div>
  
  <script src="popup.js"></script>
</body>
</html>
